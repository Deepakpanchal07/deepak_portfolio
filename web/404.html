<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Deepak Panchal - Flutter Developer & Mobile Engineer Portfolio. Building responsive, beautiful cross-platform applications with Flutter & Dart.">
  <meta name="keywords" content="Deepak Panchal, Flutter Developer, Mobile App Developer, Dart, Firebase, Android, Portfolio">
  <meta name="author" content="Deepak Panchal">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Open Graph / Social Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Deepak Panchal | Flutter Developer">
  <meta property="og:description" content="Building Beautiful Mobile Experiences with Flutter. Check out my projects, skills, and experience.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Fonts & Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Deepak Panchal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Deepak Panchal | Flutter Developer & Mobile Engineer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0A0C10;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0A0C10;
    }
    ::-webkit-scrollbar-thumb {
      background: #252A36;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #FF6B35;
    }

    /* Initial loading indicator */
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #151922 0%, #0A0C10 100%);
      color: #FFFFFF;
      z-index: 99999;
      transition: opacity 0.5s ease;
    }
    .logo-pulse {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #FFFFFF;
      margin-bottom: 24px;
    }
    .logo-pulse span {
      color: #FF6B35;
    }
    .loader-ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 107, 53, 0.15);
      border-top: 3px solid #FF6B35;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-text {
      margin-top: 16px;
      font-size: 14px;
      letter-spacing: 2px;
      color: #8C96A8;
      text-transform: uppercase;
      font-weight: 500;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo-pulse">DP<span>.</span></div>
    <div class="loader-ring"></div>
    <div class="loading-text">Loading Experience...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
